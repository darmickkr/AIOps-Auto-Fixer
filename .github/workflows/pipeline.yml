name: AIOps Pipeline

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  ci-and-self-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Gemini SDK
        run: python -m pip install --upgrade google-genai

      - name: 2. Build
        run: python stage_runner.py build

      - name: 3. Test
        run: python stage_runner.py test

      - name: 4. Docker Build
        run: python stage_runner.py docker_build

      - name: 5. Deploy
        run: python stage_runner.py deploy

      - name: 6. Smoke Test
        run: python stage_runner.py smoke
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Read agent result
        id: result
        if: always()
        run: |
          if [ -f ci-result.json ]; then
            python -c "import json; d=json.load(open('ci-result.json')); print('success='+str(d['success']).lower()); print('repair_applied='+str(d['repair_applied']).lower())" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "repair_applied=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create validated fix Pull Request
        if: success() && steps.result.outputs.success == 'true' && steps.result.outputs.repair_applied == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "AIOps Bot"
          git config user.email "aiops-bot@users.noreply.github.com"

          BRANCH_NAME="aiops-fix-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          git switch -c "$BRANCH_NAME"
          git add gamezone/Dockerfile
          git commit -m "fix: AI-validated DevOps configuration"
          git push -u origin "$BRANCH_NAME"

          gh pr create \
            --title "AIOps: Validated CI/CD recovery" \
            --body-file ci-report.md \
            --base main \
            --head "$BRANCH_NAME"

      - name: Upload CI/CD report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiops-ci-report
          path: |
            ci-report.md
            ci-failure.log
            ci-result.json
          if-no-files-found: warn
